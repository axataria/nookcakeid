<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00332A" flood-opacity="0.28" />
    </filter>
    <linearGradient id="berryCompote" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="70%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <g filter="url(#stickerShadow4)">
    <path d="M 120 14 L 216 112 C 220 148, 178 184, 126 198 L 24 164 L 32 108 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Base & Custard -->
  <path d="M 28 162 L 126 196 C 174 182, 214 146, 212 114 L 208 126 C 170 162, 122 176, 30 148 Z" fill="#20110B" />
  <path d="M 120 24 L 28 112 L 28 160 L 126 192 Z" fill="#FEF3C7" stroke="#E11D48" stroke-width="0.75" />
  <path d="M 120 24 C 158 54, 186 78, 214 112 C 182 138, 152 168, 126 192 C 122 142, 120 78, 120 24 Z" fill="#3D1A0A" />

  <!-- Ruby Berry Glaze Drips -->
  <path d="M 120 24 Q 102 52 98 80 Q 94 92 88 88 Q 80 72 74 60 Z" fill="url(#berryCompote)" opacity="0.9" />
  <path d="M 72 58 Q 66 84 62 102 Q 58 110 52 104 Q 48 90 44 80 Z" fill="url(#berryCompote)" opacity="0.9" />

  <!-- Ruby Raspberry Crown -->
  <g transform="translate(126, 44)">
    <circle cx="12" cy="12" r="14" fill="#9F1239" />
    <circle cx="6" cy="8" r="4.5" fill="#E11D48" />
    <circle cx="14" cy="6" r="4.5" fill="#F43F5E" />
    <circle cx="20" cy="10" r="4.5" fill="#E11D48" />
    <circle cx="16" cy="18" r="4.5" fill="#BE123C" />
    <circle cx="8" cy="16" r="4.5" fill="#E11D48" />
    <circle cx="12" cy="12" r="4" fill="#FB7185" />
  </g>

  <!-- Wild Blueberry -->
  <g transform="translate(154, 76)">
    <circle cx="12" cy="12" r="12" fill="#1E293B" />
    <ellipse cx="12" cy="8" rx="4" ry="2" fill="#334155" />
    <circle cx="9" cy="7" r="1.5" fill="#64748B" />
  </g>

  <!-- Blackberry -->
  <g transform="translate(162, 110)">
    <circle cx="12" cy="12" r="13" fill="#0F172A" />
    <circle cx="7" cy="8" r="4" fill="#1E1B4B" />
    <circle cx="15" cy="7" r="4" fill="#312E81" />
    <circle cx="18" cy="14" r="4" fill="#1E1B4B" />
  </g>

  <!-- Mint Leaf -->
  <path d="M 148 40 C 160 32, 168 36, 172 48 C 160 52, 150 48, 148 40 Z" fill="#4D7C0F" stroke="#365314" stroke-width="1" />

  <!-- Sticker Ribbon -->
  <g transform="translate(14, 172) rotate(-8)">
    <rect width="96" height="20" rx="4" fill="#881337" stroke="#FFFFFF" stroke-width="2" />
    <text x="48" y="14" font-family="'Space Mono', monospace" font-size="8.5" font-weight="bold" fill="#FFE4E6" text-anchor="middle">WILD BERRY</text>
  </g>
</svg>