<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00332A" flood-opacity="0.28" />
    </filter>
    <linearGradient id="rvCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0B0F" />
      <stop offset="50%" stop-color="#5B101D" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="rvCustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="35%" stop-color="#FDA4AF" />
      <stop offset="75%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="rvBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#1F030B" />
    </linearGradient>
  </defs>

  <g filter="url(#stickerShadow12)">
    <path d="M 120 18 L 216 112 C 220 148, 178 184, 126 198 L 24 164 L 32 108 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Base -->
  <path d="M 28 162 L 126 196 C 174 182, 214 146, 212 114 L 208 126 C 170 162, 122 176, 30 148 Z" fill="url(#rvBase)" />

  <!-- Custard Interior -->
  <path d="M 120 24 L 28 112 L 28 160 L 126 192 Z" fill="url(#rvCustard)" stroke="#BE123C" stroke-width="0.75" />
  <ellipse cx="68" cy="136" rx="26" ry="14" fill="#FFF1F2" opacity="0.7" filter="blur(2px)" />
  <ellipse cx="66" cy="136" rx="14" ry="7" fill="#FFFFFF" opacity="0.85" />

  <!-- Scorched Top -->
  <path d="M 120 24 C 158 54, 186 78, 214 112 C 182 138, 152 168, 126 192 C 122 142, 120 78, 120 24 Z" fill="url(#rvCrust)" />

  <ellipse cx="148" cy="90" rx="15" ry="9" fill="#1C0308" opacity="0.88" />
  <ellipse cx="178" cy="130" rx="11" ry="6" fill="#1C0308" opacity="0.9" />

  <!-- White Chocolate Curls -->
  <path d="M 136 68 Q 146 76 156 74" stroke="#FFF1F2" stroke-width="2" fill="none" opacity="0.9" />
  <path d="M 160 102 Q 170 108 180 104" stroke="#FFF1F2" stroke-width="2" fill="none" opacity="0.9" />

  <!-- Ribbon -->
  <g transform="translate(14, 172) rotate(-8)">
    <rect width="96" height="20" rx="4" fill="#881337" stroke="#FFFFFF" stroke-width="2" />
    <text x="48" y="14" font-family="'Space Mono', monospace" font-size="8.5" font-weight="bold" fill="#FFE4E6" text-anchor="middle">RED VELVET</text>
  </g>
