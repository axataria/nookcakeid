<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00332A" flood-opacity="0.28" />
    </filter>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0D05" />
      <stop offset="40%" stop-color="#3D1A0A" />
      <stop offset="70%" stop-color="#8A3D14" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="custardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="35%" stop-color="#FEF3C7" />
      <stop offset="70%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="brownieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26150D" />
      <stop offset="50%" stop-color="#3E2723" />
      <stop offset="100%" stop-color="#1A0D07" />
    </linearGradient>
  </defs>

  <!-- Sticker White Die-cut Contour -->
  <g filter="url(#stickerShadow)">
    <path d="M 120 18 L 216 112 C 220 148, 178 184, 126 198 L 24 164 L 32 108 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Cake Geometry Body -->
  <!-- 1. Baked Brownie Bottom Base -->
  <path d="M 28 162 L 126 196 C 174 182, 214 146, 212 114 L 208 126 C 170 162, 122 176, 30 148 Z" fill="url(#brownieGrad)" />

  <!-- 2. Custard Interior Cross-Section -->
  <path d="M 120 24 L 28 112 L 28 160 L 126 192 Z" fill="url(#custardGrad)" stroke="#E59B24" stroke-width="0.75" />

  <!-- 3. Molten Lava Center Glow -->
  <ellipse cx="68" cy="136" rx="28" ry="16" fill="#FBBF24" opacity="0.65" filter="blur(2px)" />
  <ellipse cx="66" cy="136" rx="14" ry="8" fill="#FFFBEB" opacity="0.75" />

  <!-- 4. Sunken Scorched Top Surface -->
  <path d="M 120 24 C 158 54, 186 78, 214 112 C 182 138, 152 168, 126 192 C 122 142, 120 78, 120 24 Z" fill="url(#crustGrad)" />

  <!-- Scorched Blisters and Caramel Cracks -->
  <ellipse cx="148" cy="88" rx="16" ry="10" fill="#180A04" opacity="0.85" />
  <ellipse cx="178" cy="132" rx="12" ry="7" fill="#180A04" opacity="0.9" />
  <ellipse cx="136" cy="144" rx="8" ry="5" fill="#3D1A0A" opacity="0.7" />
  <circle cx="160" cy="110" r="4" fill="#D97706" opacity="0.6" />
  <path d="M 138 72 Q 148 90 162 98" stroke="#D97706" stroke-width="1.5" fill="none" opacity="0.5" />

  <!-- Sticker Label Ribbon -->
  <g transform="translate(14, 172) rotate(-8)">
    <rect width="96" height="20" rx="4" fill="#0E5B44" stroke="#FFFFFF" stroke-width="2" />
    <text x="48" y="14" font-family="'Space Mono', monospace" font-size="8.5" font-weight="bold" fill="#C4DE6E" text-anchor="middle">ORIGINAL 1/5</text>
  </g>
</svg>