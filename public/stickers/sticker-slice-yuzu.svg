<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00332A" flood-opacity="0.28" />
    </filter>
    <linearGradient id="yuzuCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#583101" />
      <stop offset="60%" stop-color="#8C4A00" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="yuzuCustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="yuzuBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
  </defs>

  <g filter="url(#stickerShadow10)">
    <path d="M 120 18 L 216 112 C 220 148, 178 184, 126 198 L 24 164 L 32 108 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Base -->
  <path d="M 28 162 L 126 196 C 174 182, 214 146, 212 114 L 208 126 C 170 162, 122 176, 30 148 Z" fill="url(#yuzuBase)" />

  <!-- Custard Interior -->
  <path d="M 120 24 L 28 112 L 28 160 L 126 192 Z" fill="url(#yuzuCustard)" stroke="#CA8A04" stroke-width="0.75" />
  <ellipse cx="68" cy="136" rx="28" ry="16" fill="#FDE047" opacity="0.75" filter="blur(2px)" />
  <ellipse cx="66" cy="136" rx="14" ry="8" fill="#FEFCE8" opacity="0.85" />

  <!-- Scorched Top -->
  <path d="M 120 24 C 158 54, 186 78, 214 112 C 182 138, 152 168, 126 192 C 122 142, 120 78, 120 24 Z" fill="url(#yuzuCrust)" />

  <ellipse cx="150" cy="90" rx="15" ry="9" fill="#3D1A04" opacity="0.85" />
  <ellipse cx="180" cy="128" rx="11" ry="6" fill="#3D1A04" opacity="0.9" />

  <!-- Yuzu Zest Drizzle -->
  <path d="M 126 50 Q 146 72 168 84" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.8" />
  <circle cx="140" cy="115" r="3" fill="#FEF08A" />
  <circle cx="162" cy="138" r="2.5" fill="#FEF08A" />

  <!-- Ribbon -->
  <g transform="translate(14, 172) rotate(-8)">
    <rect width="96" height="20" rx="4" fill="#B45309" stroke="#FFFFFF" stroke-width="2" />
    <text x="48" y="14" font-family="'Space Mono', monospace" font-size="8.5" font-weight="bold" fill="#FEF08A" text-anchor="middle">HONEY YUZU</text>
  </g>
</svg>