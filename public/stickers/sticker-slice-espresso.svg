<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00332A" flood-opacity="0.28" />
    </filter>
    <linearGradient id="espressoCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0804" />
      <stop offset="50%" stop-color="#24140D" />
      <stop offset="100%" stop-color="#4A2810" />
    </linearGradient>
    <linearGradient id="espressoCustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5ECE4" />
      <stop offset="40%" stop-color="#D7BA9D" />
      <stop offset="80%" stop-color="#A57C52" />
      <stop offset="100%" stop-color="#6F4E37" />
    </linearGradient>
    <linearGradient id="espressoBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0D07" />
      <stop offset="100%" stop-color="#0A0503" />
    </linearGradient>
  </defs>

  <g filter="url(#stickerShadow9)">
    <path d="M 120 18 L 216 112 C 220 148, 178 184, 126 198 L 24 164 L 32 108 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Base -->
  <path d="M 28 162 L 126 196 C 174 182, 214 146, 212 114 L 208 126 C 170 162, 122 176, 30 148 Z" fill="url(#espressoBase)" />

  <!-- Custard Interior -->
  <path d="M 120 24 L 28 112 L 28 160 L 126 192 Z" fill="url(#espressoCustard)" stroke="#5C3D28" stroke-width="0.75" />
  <ellipse cx="68" cy="136" rx="26" ry="14" fill="#C49A6C" opacity="0.65" filter="blur(2px)" />
  <ellipse cx="66" cy="136" rx="14" ry="7" fill="#FBF7EE" opacity="0.8" />

  <!-- Scorched Top -->
  <path d="M 120 24 C 158 54, 186 78, 214 112 C 182 138, 152 168, 126 192 C 122 142, 120 78, 120 24 Z" fill="url(#espressoCrust)" />

  <ellipse cx="148" cy="88" rx="15" ry="9" fill="#0A0503" opacity="0.9" />
  <ellipse cx="178" cy="130" rx="12" ry="7" fill="#0A0503" opacity="0.9" />

  <!-- Coffee Bean Decor -->
  <ellipse cx="156" cy="116" rx="7" ry="4" fill="#1C0E07" transform="rotate(-25 156 116)" />
  <path d="M 152 114 Q 156 116 160 118" stroke="#D7BA9D" stroke-width="1" fill="none" />

  <!-- Ribbon -->
  <g transform="translate(14, 172) rotate(-8)">
    <rect width="96" height="20" rx="4" fill="#3E2723" stroke="#FFFFFF" stroke-width="2" />
    <text x="48" y="14" font-family="'Space Mono', monospace" font-size="8" font-weight="bold" fill="#D7BA9D" text-anchor="middle">ESPRESSO ROAST</text>
  </g>
</svg>